services:
  # Backend Web Service
  - type: web
    name: medikiosk-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DEMO_MODE
        value: "true"
      - key: CLIENT_URL
        value: "*"
